name: Detect Force Push to PR Branch

on:
  push:
    branches-ignore:
      - develop  # or develop or any protected branch

jobs:
  detect-force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check for force push
        uses: actions/github-script@v6
        with:
          script: |
            const before = context.payload.before;
            const after = context.payload.after;
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: before,
              head: after,
            });

            if (compare.status === 'diverged') {
              console.log('Detected force push!');
              // Optional: check if this branch is associated with an open PR
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
              });

              if (prs.data.length > 0) {
                const pr = prs.data[0];
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `Force-push detected on PR #${pr.number}. Please avoid force pushes as per contribution guidelines.`
                });
              }
            }
